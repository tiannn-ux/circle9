<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Registrasi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="container">
      <header>Form Registrasi</header>
      <form action="#" class="form">
        <div class="input-box">
          <label>Nama Lengkap</label>
          <input type="text" placeholder="Masukan nama lengkap" required />
        </div>
        <div class="input-box">
          <label>Masukan Keluhan Anda</label>
          <input type="text" placeholder="Masukan Keluhan Anda required />
        </div>
        <div class="column">
          <div class="input-box">
            <label>Nomor Telepon</label>
            <input type="number" placeholder="Masukan nomor telepon" required />
          </div>
          <div class="input-box">
            <label>Tanggal/Tahun Lahir</label>
            <input type="date" placeholder="Enter birth date" required />
          </div>
        </div>
        <div class="gender-box">
          <h3>Jenis Kelamin</h3>
          <div class="gender-option">
            <div class="gender">
              <input type="radio" id="check-male" name="gender" checked />
              <label for="check-male">Laki-Laki</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-female" name="gender" />
              <label for="check-female">Perempuan</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-other" name="gender" />
              <label for="check-other">Waria kah lu???</label>
            </div>
          </div>
        </div>
        <div class="input-box address">
          <label>Alamat</label>
          <input type="text" placeholder="Masukan alamat" required />
          <input type="text" placeholder="Masukan alamat ke 2 " required />
          <div class="column">
            <div class="select-box">
              <select>
                <option hidden>Negara</option>
                <option>Konohagakure</option>
                <option>Tsuchigakure</option>
                <option>Mizugakure</option>
                <option>AnjayGakure</option>
              </select>
            </div>
            <input type="text" placeholder="Masukan kota anda" required />
          </div>
          <div class="column">
            <input type="text" placeholder="Masukan daerah anda" required />
            <input type="number" placeholder="Masukan kode pos" required />
            <input type="time" placeholder="Masukan waktu anda" required />
          </div>
        </div>
        <button>Submit</button>
      </form>
    </section>
  </body>
