
   <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenis Gangguan-Tingkat Prioritas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Gangguan IT
            </a>

            <div>
                <a href="index.html" class="btn btn-light">
                    Gangguan IT
                </a>
            </div>

        </div>
    </nav>

    <main class="container mt-4">

        <div class="form-container">

            <h1>Tambah Jenis Gangguan IT</h1>

            <p class="text-muted">
                Silakan isi jenis gangguan
            </p>

            <hr>

            <form action="#" method="POST">

                <div class="mb-3">
                    <label for="nama" class="form-label">
                        Jenis Gangguan IT
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="gangguan"
                        name="gangguan"
                        placeholder="Masukkan jenis gangguan"
                        required
                    >
                </div>

                <div class="mb-3">

                    <label for="Prioritas" class="form-label">
                        Tingkat Prioritas
                    </label>

                    <select
                        class="form-select"
                        id="prioritas"
                        name="prioritas"
                        required
                    >
                        <option value="">-- Pilih Jenis Gangguan --</option>
                        <option value="Network">Tinggi</option>
                        <option value="Database">Sedang</option>
                        <option value="Hardware">Rendah</option>
                    </select>

                </div>
                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Simpan Data
                    </button>

                    <a
                        href="index.html"
                        class="btn btn-secondary"
                    >
                        Batal
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
</body>
</html>
