<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Teknisi - IT Support</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                IT Support / Helpdesk
            </a>

            <div>
                <a href="index.html" class="btn btn-light">
                    Data Teknisi
                </a>
            </div>

        </div>
    </nav>

    <main class="container mt-4">

        <div class="form-container">

            <h1>Tambah Data Teknisi</h1>

            <p class="text-muted">
                Silakan isi data teknisi / support staff IT.
            </p>

            <hr>

            <form action="#" method="POST">

                <div class="mb-3">
                    <label for="nama" class="form-label">
                        Nama Teknisi
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama teknisi"
                        required
                    >
                </div>

                <div class="mb-3">

                    <label for="keahlian" class="form-label">
                        Keahlian Khusus
                    </label>

                    <select
                        class="form-select"
                        id="keahlian"
                        name="keahlian"
                        required
                    >
                        <option value="">-- Pilih Keahlian --</option>
                        <option value="Network">Network</option>
                        <option value="Database">Database</option>
                        <option value="Hardware">Hardware</option>
                    </select>

                </div>

                <div class="mb-3">

                    <label for="kontak" class="form-label">
                        Kontak Internal
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="kontak"
                        name="kontak"
                        placeholder="Contoh: Ext. 101"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label for="deskripsi" class="form-label">
                        Keterangan
                    </label>

                    <textarea
                        class="form-control"
                        id="deskripsi"
                        name="deskripsi"
                        rows="4"
                        placeholder="Masukkan keterangan tambahan"
                    ></textarea>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Simpan Data
                    </button>

                    <a
                        href="index.html"
                        class="btn btn-secondary"
                    >
                        Batal
                    </a>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
